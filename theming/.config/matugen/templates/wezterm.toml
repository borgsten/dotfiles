# Rendered to ~/.cache/theming/wezterm/Noctalia.toml, which wezterm picks up via
# config.color_scheme_dirs. The palette roles mirror templates/ghostty so both
# terminals end up with the same colours.
[colors]
background = "{{colors.background.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
cursor_bg = "{{colors.primary.default.hex}}"
cursor_border = "{{colors.primary.default.hex}}"
cursor_fg = "{{colors.on_primary.default.hex}}"
compose_cursor = "{{colors.primary.default.hex}}"
selection_bg = "{{colors.secondary_container.default.hex}}"
selection_fg = "{{colors.on_secondary_container.default.hex}}"
scrollbar_thumb = "{{colors.outline.default.hex}}"
split = "{{colors.outline_variant.default.hex}}"
visual_bell = "{{colors.error.default.hex}}"
# ANSI colours from noctalia's terminal roles: curated palettes pass their
# real terminal colours through, and brights stay readable on dark themes.
# Each hue is pulled halfway toward its conventional one: wallpaper themes
# fill several slots with the same Material role (green == magenta), which
# made ls colours (vivid ansi-plus) indistinguishable. Curated palettes
# shift little since their hues are already close.
ansi = [
    "{{colors.terminal_normal_black.default.hex}}",
    "{{colors.terminal_normal_red.default.hex | blend: "#ff1500", 0.5}}",
    "{{colors.terminal_normal_green.default.hex | blend: "#2bff00", 0.5}}",
    "{{colors.terminal_normal_yellow.default.hex | blend: "#ffbf00", 0.5}}",
    "{{colors.terminal_normal_blue.default.hex | blend: "#006aff", 0.5}}",
    "{{colors.terminal_normal_magenta.default.hex | blend: "#ff00ff", 0.5}}",
    "{{colors.terminal_normal_cyan.default.hex | blend: "#00ffff", 0.5}}",
    "{{colors.terminal_normal_white.default.hex}}",
]
brights = [
    "{{colors.terminal_bright_black.default.hex}}",
    "{{colors.terminal_bright_red.default.hex | blend: "#ff1500", 0.5}}",
    "{{colors.terminal_bright_green.default.hex | blend: "#2bff00", 0.5}}",
    "{{colors.terminal_bright_yellow.default.hex | blend: "#ffbf00", 0.5}}",
    "{{colors.terminal_bright_blue.default.hex | blend: "#006aff", 0.5}}",
    "{{colors.terminal_bright_magenta.default.hex | blend: "#ff00ff", 0.5}}",
    "{{colors.terminal_bright_cyan.default.hex | blend: "#00ffff", 0.5}}",
    "{{colors.terminal_bright_white.default.hex}}",
]

# tmux-style flat bar: every tab keeps the bar background and only the text
# colour changes, so the accent goes on the active tab's foreground.
#
# Backgrounds are fully transparent on purpose: wezterm already paints the
# window background (at window_background_opacity) under the tab bar, so any
# alpha here stacks on top of it and the bar ends up looking opaque.
[colors.tab_bar]
background = "rgba(0,0,0,0)"
inactive_tab_edge = "{{colors.outline.default.hex}}"

[colors.tab_bar.active_tab]
bg_color = "rgba(0,0,0,0)"
fg_color = "{{colors.primary.default.hex}}"
intensity = "Bold"

[colors.tab_bar.inactive_tab]
bg_color = "rgba(0,0,0,0)"
fg_color = "{{colors.outline.default.hex}}"

[colors.tab_bar.inactive_tab_hover]
bg_color = "rgba(0,0,0,0)"
fg_color = "{{colors.on_surface.default.hex}}"

[colors.tab_bar.new_tab]
bg_color = "rgba(0,0,0,0)"
fg_color = "{{colors.outline.default.hex}}"

[colors.tab_bar.new_tab_hover]
bg_color = "rgba(0,0,0,0)"
fg_color = "{{colors.on_surface.default.hex}}"

[metadata]
author = "matugen"
name = "Noctalia"
