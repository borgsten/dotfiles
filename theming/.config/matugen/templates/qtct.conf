# qt5ct/qt6ct config, generated by matugen.
# qt6ct does not expand ~ in stylesheet paths, so @HOME@ is filled in by the post_hook.
[Appearance]
color_scheme_path=@HOME@/.cache/theming/qt-colors.conf
custom_palette=true
icon_theme=Adwaita-Symbolic
standard_dialogs=xdgdesktopportal
style=Fusion

[Interface]
stylesheets=@HOME@/.cache/theming/qt.qss
